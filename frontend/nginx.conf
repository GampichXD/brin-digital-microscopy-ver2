# Konfigurasi nginx di dalam kontainer frontend (menyajikan hasil build Vite).
# Header keamanan dipasang nginx terluar (../nginx/default.conf), bukan di sini.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Jangan tampilkan versi nginx di halaman error (ZAP 10009).
    server_tokens off;

    # File hasil build Vite bernama hash (index-AbC123.js): isinya tidak pernah
    # berubah, aman di-cache lama oleh browser dan Cloudflare.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker PWA dan manifest harus selalu dicek ulang. Kalau ter-cache,
    # browser bisa tertahan di versi aplikasi lama setelah deploy.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html selalu dicek ulang supaya deploy baru langsung terpakai.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
