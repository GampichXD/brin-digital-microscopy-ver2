services:
  postgres:
    image: postgres:16-alpine
    container_name: mikroskop_postgres
    environment:
      POSTGRES_DB: microscopy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mikroskop_redis
    ports:
      - "127.0.0.1:6380:6379" # Ubah host port ke 6380 untuk mencegah bentrok dengan Redis Windows lokal

  frontend:
    build: ./frontend
    container_name: mikroskop_frontend

  backend:
    build: ./backend
    container_name: mikroskop_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/microscopy_db
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend/static/datasets:/app/static/datasets
      - ./backend/static/uploads:/app/static/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    # Jika nanti di Linux/Raspberry Pi/Jetson untuk hardware fisik:
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    #   - "/dev/video0:/dev/video0"

  nginx:
    image: nginx:alpine
    container_name: mikroskop_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    container_name: mikroskop_ngrok
    restart: unless-stopped
    command:
      - "http"
      - "nginx:80"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - nginx

volumes:
  postgres_data: