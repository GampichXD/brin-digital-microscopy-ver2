# Log kontainer dibatasi. Tanpa ini, log uvicorn tumbuh tanpa batas di disk VPS.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: mikroskop_postgres
    environment:
      POSTGRES_DB: microscopy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: mikroskop_redis
    ports:
      - "127.0.0.1:6380:6379" # Ubah host port ke 6380 untuk mencegah bentrok dengan Redis Windows lokal

  frontend:
    logging: *default-logging
    build: ./frontend
    container_name: mikroskop_frontend

  backend:
    logging: *default-logging
    build: ./backend
    container_name: mikroskop_backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Password harus aman untuk URL (token_urlsafe). Mengganti nilai ini TIDAK mengubah
      # password volume yang sudah ada: jalankan ALTER USER dulu (lihat README).
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/microscopy_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY belum diisi di .env}
      - EDGE_DEVICE_TOKEN=${EDGE_DEVICE_TOKEN:?EDGE_DEVICE_TOKEN belum diisi di .env}
      # false hanya selama transisi, sampai Jetson memakai kode baru.
      - EDGE_TOKEN_REQUIRED=${EDGE_TOKEN_REQUIRED:-true}
    volumes:
      - ./backend/static/datasets:/app/static/datasets
      - ./backend/static/uploads:/app/static/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    # Jika nanti di Linux/Raspberry Pi/Jetson untuk hardware fisik:
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    #   - "/dev/video0:/dev/video0"

  nginx:
    logging: *default-logging
    image: nginx:alpine
    container_name: mikroskop_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  # Tidak dipakai lagi sejak situs di belakang Cloudflare; disimpan sebagai riwayat hosting.
  # Tidak ikut dijalankan kecuali diminta: docker compose --profile ngrok up -d ngrok
  ngrok:
    profiles: ["ngrok"]
    logging: *default-logging
    image: ngrok/ngrok:latest
    container_name: mikroskop_ngrok
    restart: unless-stopped
    command:
      - "http"
      - "nginx:80"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      # Inspector ngrok menyimpan isi request (termasuk password login): jangan dibuka ke publik.
      - "127.0.0.1:4040:4040"
    depends_on:
      - nginx

volumes:
  postgres_data: