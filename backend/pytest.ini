[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: tes unit tanpa server (fungsi murni, RoomManager)
    integration: tes endpoint lewat TestClient
    security: autentikasi, otorisasi, path traversal, guard WebSocket
filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.PydanticDeprecatedSince20
