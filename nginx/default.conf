server {
    listen 80;

    # Meningkatkan batas upload payload Base64/Dataset dari AI (50 MB)
    client_max_body_size 50M;

    # Mengarahkan request frontend ke container react
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Dukungan WebSocket untuk Vite HMR (opsional jika development)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Mengarahkan request static files (gambar hasil analisis/dataset) ke FastAPI
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Mengarahkan request API ke container python (FastAPI)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # [CRITICAL] Dukungan WebSocket untuk FastAPI (wajib untuk hardware streaming)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}