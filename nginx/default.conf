server {
    listen 80;

    # Meningkatkan batas upload payload Base64/Dataset dari AI (50 MB)
    client_max_body_size 50M;

    # Header keamanan. Diwarisi semua location di bawah karena tidak ada yang mendefinisikan add_header.
    # CSP sengaja belum dipasang: perlu diuji dulu terhadap WebSocket, gambar base64, dan Vite.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # Mengarahkan request frontend ke container react
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Dukungan WebSocket untuk Vite HMR (opsional jika development)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Mengarahkan request static files (gambar hasil analisis/dataset) ke FastAPI
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Mengarahkan request API ke container python (FastAPI)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # [CRITICAL] Dukungan WebSocket untuk FastAPI (wajib untuk hardware streaming)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Grid scan berjalan sinkron dan bisa memakan menit-an untuk grid besar.
        # Default nginx (60s) memutus koneksi -> frontend mencatat "Gagal".
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}